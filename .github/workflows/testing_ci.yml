name: Testing Workflow

on:
  pull_request:
  release:
  push:
    branches:
      - main

jobs:

  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set Python environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: x64

      - name: Install dependencies
        run: |
          python -m venv /tmp/.venv --system-site-packages
          . /tmp/.venv/bin/activate
          python -m pip install -U setuptools uv
          uv pip install -r requirements_dev.txt

      # - name: Lint with ruff
      #   run: ruff check .
  
      - name: Check code format with Black
        run: black --check .

  unit_tests:
    needs: linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m venv /tmp/.venv --system-site-packages
        . /tmp/.venv/bin/activate
        python -m pip install -U setuptools uv
        sudo apt-get install -y libspatialite-dev libsqlite3-mod-spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite
        uv pip install -r requirements.txt
        uv pip install -r requirements_dev.txt
        uv pip install -r requirements_optional.txt
        python -m uv pip install -e .[dev]

    - name: Runs unit tests
      run: |
        python -m pytest -v

  build_documentation:
    needs: linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m venv /tmp/.venv --system-site-packages
        . /tmp/.venv/bin/activate
        python -m pip install -U setuptools uv
        sudo apt-get install -y libspatialite-dev libsqlite3-mod-spatialite pandoc
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite
        uv pip install wheel spatialite
        uv pip install -r docs/requirements_docs.txt
        python -m uv pip install -e .[dev]

    - name: Prepare data
      run: mv ./tests/data/docs/population.zip /tmp/population.zip

    - name: Builds documentation
      run: |
        cd docs
        make html

    - name: Keeps documentation on GitHub
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/build/
        if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`
        
    - name: Deploy 🚀
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@4.1.4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: docs/build/html # The folder the action should deploy.

  builds_package:
    needs: build_documentation
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9
    - name: Install dependencies
      run: |
        python -m venv /tmp/.venv --system-site-packages
        . /tmp/.venv/bin/activate
        sudo apt-get install -y pandoc
        python -m pip install -U setuptools uv
        uv pip install wheel
        uv pip install -r requirements_dev.txt
        uv pip install -r requirements.txt
        uv pip install -r requirements_optional.txt        

    - name: Builds package
      run: python setup.py sdist bdist_wheel

    - name: Stores artifacts along with the workflow result
      uses: actions/upload-artifact@v4
      with:
        name: library
        path: dist/*.whl
        if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`

    - name: Publish wheels to PyPI
      if: ${{ github.event_name == 'release'}}
      env:
        TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
        TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      run: |
        uv pip install twine
        twine upload dist/*.whl
        twine upload dist/*.gz
