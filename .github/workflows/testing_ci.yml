name: Testing Workflow

on:
  pull_request:
  release:
  push:
    branches:
      - main

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Python environment
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install -U pip uv
          python -m uv pip install ruff==0.9.10 black==25.1.0

      - name: Lint with ruff
        run: ruff check .
  
      - name: Check code format with Black
        run: |
          black --check .

  unit_tests:
    needs: linting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install -U pip uv
        python -m uv pip install -e .[dev]

    - name: Install spatialite
      run: |
        sudo apt update
        sudo apt install libspatialite-dev 
        sudo apt install -y libsqlite3-mod-spatialite
        pip3 install spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Runs unit tests
      run: |
        python -m pytest --cov-report term-missing --cov=tradesman tests

  build_documentation:
    needs: linting
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install dependencies
      run: |
        python -m pip install -U pip uv
        python -m uv pip install -e .[dev]

    - name: Install spatialite
      run: |
        sudo apt update
        sudo apt install libspatialite-dev 
        sudo apt install -y libsqlite3-mod-spatialite
        sudo apt install -y pandoc
        pip3 install spatialite
        sudo ln -s /usr/lib/x86_64-linux-gnu/mod_spatialite.so /usr/lib/x86_64-linux-gnu/mod_spatialite

    - name: Prepare data
      run: mv ./tests/data/docs/population.zip /tmp/population.zip

    - name: Builds documentation
      run: |
        cd docs
        make html

    - name: Keeps documentation on GitHub
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/build/
        if-no-files-found: error # 'warn' or 'ignore' are also available, defaults to `warn`
        
    - name: Deploy 🚀
      if: github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@4.1.4
      with:
        branch: gh-pages # The branch the action should deploy to.
        folder: docs/build/html # The folder the action should deploy.

  make_sdist:
    needs: linting
    name: Make SDist
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Build SDist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build_wheels:
    needs: linting
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-13, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        run: pipx run build --wheel

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: dist/*.whl
  
  upload_all:
    needs: [build_wheels, make_sdist]
    environment: pypi
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: cibw-*
        path: dist
        merge-multiple: true

    - uses: pypa/gh-action-pypi-publish@release/v1
